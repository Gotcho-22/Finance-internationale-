<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Historique des taux EUR/USD</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--tx:#12231c;--mu:#5a6d64;--ac:#1f7a5c;--ac2:#b87d12;--bd:#d3ddd7;--ok:#1f7a5c;--ko:#b3402b}
@media(prefers-color-scheme:dark){:root{--bg:#0d1612;--card:#15231c;--tx:#e6efe9;--mu:#92a89c;--ac:#4cc49a;--ac2:#e0a93a;--bd:#254034;--ok:#4cc49a;--ko:#ef8a74}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding:16px;max-width:620px;margin-inline:auto}
h1{font:700 1.5rem/1.2 Georgia,serif;margin:8px 0 4px}
h2{font:700 1.15rem/1.3 Georgia,serif;margin:0 0 10px}
.sub{color:var(--mu);font-size:.9rem;margin:0 0 16px}
section{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
label{display:block;font-size:.85rem;color:var(--mu);margin-bottom:4px}
input,select,button{font:inherit;color:inherit;border-radius:10px;border:1px solid var(--bd);background:var(--bg);padding:10px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
svg{width:100%;height:auto;display:block}
.res{margin-top:10px;padding-top:10px;border-top:2px solid var(--ac2)}
.big{font:700 1.4rem/1.3 Georgia,serif;color:var(--ac)}
.mu{color:var(--mu);font-size:.88rem}
button.go{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer;margin-top:10px}
button.alt{cursor:pointer;margin-top:8px}
.fb{margin-top:10px;font-weight:600}.ok{color:var(--ok)}.ko{color:var(--ko)}
.sol{font-size:.9rem;color:var(--mu);margin-top:6px;white-space:pre-line}
</style>
</head>
<body>
<h1>Historique EUR/USD</h1>
<p class="sub" id="src">Chargement des données…</p>

<section>
  <h2>Évolution depuis 1999</h2>
  <div id="graph" role="img" aria-label="Courbe du cours moyen annuel de l'euro en dollars"></div>
  <p class="mu">Moyenne annuelle, en dollars pour 1 euro. L'année en cours est une moyenne partielle.</p>
  <div class="row">
    <div><label for="a">De l'année</label><select id="a"></select></div>
    <div><label for="b">À l'année</label><select id="b"></select></div>
  </div>
  <div class="res"><div class="big" id="out"></div><div class="mu" id="det"></div></div>
</section>

<section>
  <h2>Exercice de variation</h2>
  <p id="enonce"></p>
  <label for="rep">Ta réponse en % (ex. −12,5)</label>
  <input id="rep" type="text" inputmode="decimal">
  <button class="go" id="ver">Vérifier</button>
  <button class="alt" id="nv">Nouvel exercice</button>
  <div class="fb" id="fb" aria-live="polite"></div>
  <div class="sol" id="sol"></div>
</section>

<script>
const FALLBACK=[[1999,1.066],[2000,.924],[2001,.895],[2002,.945],[2003,1.131],[2004,1.244],[2005,1.245],[2006,1.256],[2007,1.371],[2008,1.471],[2009,1.394],[2010,1.326],[2011,1.392],[2012,1.285],[2013,1.328],[2014,1.329],[2015,1.11],[2016,1.107],[2017,1.13],[2018,1.181],[2019,1.12],[2020,1.142],[2021,1.183],[2022,1.053],[2023,1.081],[2024,1.082]].map(([y,v])=>({y,v}));
const $=id=>document.getElementById(id);
const nf=new Intl.NumberFormat("fr-FR",{maximumFractionDigits:2});
const nf4=new Intl.NumberFormat("fr-FR",{maximumFractionDigits:4});
let D=[],exo=null;

async function charger(){
  const urls=["https://raw.githubusercontent.com/datasets/exchange-rates/main/data/monthly.csv",
              "https://datahub.io/core/exchange-rates/_r/-/data/monthly.csv"];
  for(const u of urls){
    try{
      const r=await fetch(u);if(!r.ok)continue;
      const s={},n={};
      (await r.text()).split(/\r?\n/).slice(1).forEach(l=>{
        const c=l.split(",");if(c.length<3)return;
        if(!c[1].toLowerCase().includes("euro"))return;
        const v=parseFloat(c[2]);if(isNaN(v))return;
        const y=c[0].replace(/"/g,"").slice(0,4);
        s[y]=(s[y]||0)+v;n[y]=(n[y]||0)+1;
      });
      const out=Object.keys(s).map(y=>({y:+y,v:s[y]/n[y]})).sort((a,b)=>a.y-b.y);
      if(out.length>10){$("src").textContent="Source : Réserve fédérale américaine (FRED), moyennes annuelles.";return out}
    }catch(e){}
  }
  $("src").textContent="Connexion impossible : valeurs annuelles approximatives.";
  return FALLBACK;
}
const val=y=>D.find(d=>d.y===y).v;

function dessiner(){
  const W=600,H=280,L=42,R=10,T=10,B=26;
  const ys=D.map(d=>d.y),vs=D.map(d=>d.v);
  const y0=ys[0],y1=ys[ys.length-1];
  const mn=Math.floor(Math.min(...vs)*10)/10,mx=Math.ceil(Math.max(...vs)*10)/10;
  const X=y=>L+(y-y0)/(y1-y0)*(W-L-R),Y=v=>T+(mx-v)/(mx-mn)*(H-T-B);
  let g=`<svg viewBox="0 0 ${W} ${H}">`;
  for(let v=mn;v<=mx+1e-9;v+=0.1){
    g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--bd)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--mu)">${nf.format(v)}</text>`;
  }
  for(let y=Math.ceil(y0/5)*5;y<=y1;y+=5)g+=`<text x="${X(y)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--mu)">${y}</text>`;
  g+=`<polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="${D.map(d=>X(d.y)+","+Y(d.v)).join(" ")}"/>`;
  const a=+$("a").value,b=+$("b").value;
  [a,b].forEach(y=>{g+=`<circle cx="${X(y)}" cy="${Y(val(y))}" r="5" fill="var(--ac2)"/>`});
  $("graph").innerHTML=g+"</svg>";
}
function calculer(){
  const a=+$("a").value,b=+$("b").value,va=val(a),vb=val(b);
  const e=(vb-va)/va*100,d=(va/vb-1)*100;
  $("out").textContent="Euro : "+(e>=0?"+":"")+nf.format(e)+" %";
  $("det").textContent=`En ${a}, 1 EUR = ${nf4.format(va)} USD. En ${b}, 1 EUR = ${nf4.format(vb)} USD. Pour le dollar face à l'euro : ${d>=0?"+":""}${nf.format(d)} %.`;
  dessiner();
}
function nouvelExo(){
  $("fb").textContent="";$("sol").textContent="";$("rep").value="";
  let a,b;do{a=D[Math.floor(Math.random()*D.length)].y;b=D[Math.floor(Math.random()*D.length)].y}while(b-a<3);
  const va=Math.round(val(a)*10000)/10000,vb=Math.round(val(b)*10000)/10000;
  const dollar=Math.random()<.4;
  const rep=dollar?(va/vb-1)*100:(vb-va)/va*100;
  exo={rep,sol:dollar
    ?`Le dollar vaut 1/cours euro. Variation = (1/${nf4.format(vb)} − 1/${nf4.format(va)}) ÷ (1/${nf4.format(va)}) = ${nf.format(rep)} %`
    :`Variation = (nouveau − ancien) ÷ ancien = (${nf4.format(vb)} − ${nf4.format(va)}) ÷ ${nf4.format(va)} = ${nf.format(rep)} %`};
  $("enonce").textContent=`Le cours moyen passe de 1 EUR = ${nf4.format(va)} USD en ${a} à ${nf4.format(vb)} USD en ${b}. Quelle est la variation ${dollar?"du dollar face à l'euro":"de l'euro face au dollar"} en % (arrondie à 0,1) ?`;
}
function verifier(){
  const v=parseFloat($("rep").value.replace(/\s/g,"").replace(",",".").replace("−","-"));
  if(isNaN(v)){$("fb").className="fb ko";$("fb").textContent="Entre un nombre.";return}
  const bon=Math.abs(v-exo.rep)<=0.3;
  $("fb").className="fb "+(bon?"ok":"ko");
  $("fb").textContent=bon?"Correct.":"Pas tout à fait. Réponse attendue : "+nf.format(exo.rep)+" %";
  $("sol").textContent=exo.sol;
}
(async()=>{
  D=await charger();
  D.forEach(d=>{$("a").add(new Option(d.y,d.y));$("b").add(new Option(d.y,d.y))});
  const ys=D.map(d=>d.y);
  $("a").value=ys.includes(2008)?2008:ys[0];$("b").value=ys[ys.length-1];
  calculer();nouvelExo();
  $("a").oninput=$("b").oninput=calculer;
  $("ver").onclick=verifier;$("nv").onclick=nouvelExo;
  $("rep").addEventListener("keydown",e=>{if(e.key==="Enter")verifier()});
})();
</script>
</body>
</html>
