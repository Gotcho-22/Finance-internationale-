<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Convertisseur de devises</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--tx:#12231c;--mu:#5a6d64;--ac:#1f7a5c;--ac2:#b87d12;--bd:#d3ddd7;--ok:#1f7a5c;--ko:#b3402b}
@media(prefers-color-scheme:dark){:root{--bg:#0d1612;--card:#15231c;--tx:#e6efe9;--mu:#92a89c;--ac:#4cc49a;--ac2:#e0a93a;--bd:#254034;--ok:#4cc49a;--ko:#ef8a74}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding:16px;max-width:560px;margin-inline:auto}
h1{font:700 1.5rem/1.2 Georgia,serif;margin:8px 0 4px}
h2{font:700 1.15rem/1.3 Georgia,serif;margin:0 0 10px}
.sub{color:var(--mu);font-size:.9rem;margin:0 0 16px}
section{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
label{display:block;font-size:.85rem;color:var(--mu);margin-bottom:4px}
input,select,button{font:inherit;color:inherit;border-radius:10px;border:1px solid var(--bd);background:var(--bg);padding:10px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end;margin-top:10px}
.sw{width:44px;padding:10px 0;cursor:pointer;font-weight:700}
.res{margin-top:16px;padding-top:14px;border-top:2px solid var(--ac2)}
.big{font:700 2rem/1.2 Georgia,serif;color:var(--ac);word-break:break-word}
.mu{color:var(--mu);font-size:.88rem}
button.go{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer;margin-top:10px}
button.alt{cursor:pointer;margin-top:8px}
.enonce{margin:0 0 10px}
.fb{margin-top:10px;font-weight:600}
.ok{color:var(--ok)}.ko{color:var(--ko)}
.sol{font-size:.9rem;color:var(--mu);margin-top:6px;white-space:pre-line}
.note{border-left:3px solid var(--ac2);padding-left:10px;font-size:.88rem;color:var(--mu)}
</style>
</head>
<body>
<h1>Convertisseur de devises</h1>
<p class="sub" id="src">Chargement des taux…</p>

<section>
  <h2>Convertir</h2>
  <label for="mt">Montant</label>
  <input id="mt" type="number" inputmode="decimal" value="1000" min="0">
  <div class="row">
    <div><label for="de">De</label><select id="de"></select></div>
    <button class="sw" id="sw" aria-label="Inverser les devises">⇄</button>
    <div><label for="vers">Vers</label><select id="vers"></select></div>
  </div>
  <div class="res">
    <div class="big" id="out">…</div>
    <div class="mu" id="tx"></div>
  </div>
  <p class="note">Le franc CFA (XOF) est lié à l'euro par une parité fixe : 1 EUR = 655,957 XOF.</p>
</section>

<section>
  <h2>Exercice de change</h2>
  <p class="enonce" id="enonce"></p>
  <label for="rep">Ta réponse</label>
  <input id="rep" type="text" inputmode="decimal" placeholder="Ex. 1234,5">
  <button class="go" id="ver">Vérifier</button>
  <button class="alt" id="nv">Nouvel exercice</button>
  <div class="fb" id="fb" aria-live="polite"></div>
  <div class="sol" id="sol"></div>
</section>

<script>
const DEV=["EUR","USD","XOF","GBP","CHF","JPY","CNY","MAD","NGN","GHS"];
const SECOURS={eur:1,usd:1.16,xof:655.957,gbp:0.87,chf:0.93,jpy:175,cny:8.3,mad:10.8,ngn:1700,ghs:12.5};
const $=id=>document.getElementById(id);
const nf=new Intl.NumberFormat("fr-FR",{maximumFractionDigits:4});
let R=SECOURS,exo=null;

async function charger(){
  const urls=["https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/eur.min.json",
              "https://latest.currency-api.pages.dev/v1/currencies/eur.json"];
  for(const u of urls){
    try{
      const r=await fetch(u);
      if(r.ok){const j=await r.json();R=j.eur;R.eur=1;$("src").textContent="Taux indicatifs du "+j.date;return}
    }catch(e){}
  }
  R=SECOURS;$("src").textContent="Connexion impossible : taux approximatifs de secours.";
}
const taux=(a,b)=>R[b.toLowerCase()]/R[a.toLowerCase()];

function convertir(){
  const m=parseFloat($("mt").value),a=$("de").value,b=$("vers").value;
  if(isNaN(m)){$("out").textContent="Entre un montant";$("tx").textContent="";return}
  const t=taux(a,b);
  $("out").textContent=nf.format(m*t)+" "+b;
  $("tx").textContent="1 "+a+" = "+nf.format(t)+" "+b;
}

const alea=(a,b)=>Math.round((a+Math.random()*(b-a))*100)/100;
function nouvelExo(){
  const k=Math.floor(Math.random()*3);
  const eurUsd=Math.round(R.usd*10000)/10000, eurXof=Math.round(R.xof*100)/100;
  $("fb").textContent="";$("sol").textContent="";$("rep").value="";
  if(k===0){
    const m=[500,800,1200,2500,4000][Math.floor(Math.random()*5)];
    exo={rep:m*eurXof,tol:.01,
      sol:`Montant × taux = ${m} × ${nf.format(eurXof)} = ${nf.format(m*eurXof)} XOF`};
    $("enonce").textContent=`Un client règle une facture de ${m} EUR. Taux : 1 EUR = ${nf.format(eurXof)} XOF. Combien cela fait-il en XOF ?`;
  }else if(k===1){
    const c=eurXof/eurUsd;
    exo={rep:c,tol:.01,
      sol:`Taux croisé USD/XOF = EUR/XOF ÷ EUR/USD = ${nf.format(eurXof)} ÷ ${nf.format(eurUsd)} = ${nf.format(c)}`};
    $("enonce").textContent=`On cote 1 EUR = ${nf.format(eurUsd)} USD et 1 EUR = ${nf.format(eurXof)} XOF. Combien de XOF vaut 1 USD ?`;
  }else{
    const a=alea(1.05,1.12),b=alea(1.13,1.2),v=(b-a)/a*100;
    exo={rep:v,abs:.2,
      sol:`Variation = (nouveau − ancien) ÷ ancien = (${nf.format(b)} − ${nf.format(a)}) ÷ ${nf.format(a)} = ${nf.format(v)} %\nL'euro s'apprécie face au dollar.`};
    $("enonce").textContent=`Le taux EUR/USD passe de ${nf.format(a)} à ${nf.format(b)}. Quelle est la variation de l'euro en % (arrondie à 0,1) ?`;
  }
}
function verifier(){
  const v=parseFloat($("rep").value.replace(/\s/g,"").replace(",","."));
  if(isNaN(v)){$("fb").className="fb ko";$("fb").textContent="Entre un nombre.";return}
  const bon=exo.abs?Math.abs(v-exo.rep)<=exo.abs:Math.abs(v-exo.rep)/Math.abs(exo.rep)<=exo.tol;
  $("fb").className="fb "+(bon?"ok":"ko");
  $("fb").textContent=bon?"Correct.":"Pas tout à fait. Réponse attendue : "+nf.format(exo.rep);
  $("sol").textContent=exo.sol;
}

(async()=>{
  DEV.forEach(d=>{$("de").add(new Option(d,d));$("vers").add(new Option(d,d))});
  $("de").value="EUR";$("vers").value="XOF";
  await charger();convertir();nouvelExo();
  ["mt","de","vers"].forEach(i=>$(i).addEventListener("input",convertir));
  $("sw").onclick=()=>{const a=$("de").value;$("de").value=$("vers").value;$("vers").value=a;convertir()};
  $("ver").onclick=verifier;$("nv").onclick=nouvelExo;
  $("rep").addEventListener("keydown",e=>{if(e.key==="Enter")verifier()});
})();
</script>
</body>
</html>
